name: Deploy site to GitHub Pages

# Publishes the static site in docs/ to GitHub Pages.
# Enable once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync data artefacts into the site
        run: |
          mkdir -p docs/data
          cp data/discrepancies.json docs/data/discrepancies.json
          cp data/evidence/score_integrity_study.json docs/data/score_integrity_study.json
          cp data/market_sensitivity_2025_2026.json docs/data/market_sensitivity_2025_2026.json

      - name: Sanity-check the data the site will render
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          ok = True
          checks = {
            "docs/data/discrepancies.json": lambda d: d["meta"]["counts"]["total_records"] > 0,
            "docs/data/score_integrity_study.json": lambda d: "totals" in d and "caveat" in d,
            "docs/data/market_sensitivity_2025_2026.json": lambda d: "summary" in d,
          }
          for path, test in checks.items():
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"MISSING {path}"); ok = False; continue
              d = json.loads(p.read_text())
              if not test(d):
                  print(f"FAILED CONTENT CHECK {path}"); ok = False
              else:
                  print(f"ok {path} ({p.stat().st_size} bytes)")
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
