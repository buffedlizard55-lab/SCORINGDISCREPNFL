name: Detect scoring discrepancies

# Scheduled differential detection.
#
# WHY THIS CADENCE
#   nflverse refreshes its raw play-by-play weekly "to incorporate stat
#   corrections during the week" on Wednesdays 02:00 UTC, and the official
#   corrections were historically published on the Wednesday after the games.
#   We therefore poll daily in season and rely on the diff to surface anything
#   that moved, rather than trying to hit an exact publish time.
#
# NOTIFICATION IS OFF BY DEFAULT.
#   Set the repository secret ALERT_WEBHOOK_URL to receive alerts (Slack or
#   Discord compatible incoming webhook). Without it, alerts are written to the
#   job summary and uploaded as an artefact. This is deliberate: a fork of this
#   repo must never be able to spam a third party.

on:
  schedule:
    # Daily at 12:00 UTC during the NFL season (Sep-Feb), plus a Wednesday run
    # shortly after nflverse's 02:00 UTC correction refresh lands.
    - cron: '0 12 * 9,10,11,12,1,2 *'
    - cron: '0 4 * 9,10,11,12,1,2 3'
  workflow_dispatch:
    inputs:
      min_severity:
        description: 'Minimum severity to report (0-3)'
        required: false
        default: '2'

permissions:
  contents: write
  issues: write

concurrency:
  group: detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests (must pass before we trust any alert)
        run: python3 tests/test_pipeline.py

      - name: Validate the archived-page parser against real HTML
        run: |
          # Reconciles parse_corrections.py against a known-good archived
          # official page. This is the check that could not be run in the
          # restricted build sandbox; it is authoritative here.
          python3 pipeline/run.py selfcheck
        continue-on-error: true

      - name: Fetch current snapshot of the official record
        run: python3 pipeline/run.py snapshot

      - name: Diff against the previous snapshot
        id: diff
        run: |
          set +e
          PREV=$(ls -1dt snapshots/nfldata_games/*/ 2>/dev/null | sed -n 2p)
          if [ -z "$PREV" ]; then
            echo "No previous snapshot yet — this run establishes the baseline."
            echo "alerts=0" >> "$GITHUB_OUTPUT"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUR=$(ls -1dt snapshots/nfldata_games/*/ | sed -n 1p)
          echo "prev=$PREV cur=$CUR"
          # Diff the slim frozen-field snapshots (final games only). The full
          # source file is referenced by SHA-256 in each manifest so any alert
          # can be traced back to the exact bytes that produced it.
          python3 pipeline/run.py diff "${PREV}games.slim.csv" "${CUR}games.slim.csv" \
            --min-severity "${{ github.event.inputs.min_severity || 2 }}" \
            --out alerts/latest.md
          CODE=$?
          echo "exit=$CODE"
          echo "alerts=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish to job summary
        if: always()
        run: |
          if [ -f alerts/latest.md ]; then
            cat alerts/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No alerts file produced (baseline run or no diffs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify webhook (only if configured and alerts exist)
        if: steps.diff.outputs.alerts == '10' && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "pipeline")
          import detect
          report = json.load(open("alerts/latest.json"))
          ok, msg = detect.notify_webhook(report, os.environ["WEBHOOK"])
          print("webhook:", ok, msg)
          PY

      - name: Upload evidence artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-${{ github.run_id }}
          path: |
            snapshots/nfldata_games/**/*.manifest.json
            alerts/
          retention-days: 90
          if-no-files-found: ignore

      # The snapshot store is the system's memory: without it there is nothing
      # to diff against on the next run.
      - name: Persist snapshots
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f snapshots/ alerts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: detection snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push || echo "push skipped"
          fi
