name: Detect scoring discrepancies

# Scheduled differential detection.
#
# SCOPE AND CADENCE
#   This is a low-frequency final-game score-mirror check only. It snapshots
#   nflverse/nfldata data/games.csv and diffs five frozen fields. It does NOT
#   consume raw play-by-play or the retired NFL/Elias corrections feed, and it
#   does NOT monitor player-stat changes. The seasonal daily schedule is a
#   prototype cadence, not a source freshness or GitHub Actions SLA.
#
# NOTIFICATION IS OFF BY DEFAULT.
#   Set the repository secret ALERT_WEBHOOK_URL to receive alerts (Slack or
#   Discord compatible incoming webhook). Without it, alerts are still written to
#   the job summary, uploaded as an artefact, appended to the comparison feed and
#   published as a subscribable Atom feed at data/alerts/feed.atom — a
#   zero-configuration pull channel that needs no secret at all. Push being off
#   by default is deliberate: a fork of this repo must never be able to spam a
#   third party.
#
# EVERY DELIVERY ATTEMPT IS RECORDED.
#   `run.py deliver` writes data/alerts/deliveries.json: idempotency key, retry
#   count, HTTP outcome, dead-letter flag. A webhook that exhausts its retries
#   exits 11 and fails this job, so the baseline is not advanced and the next run
#   retries the same alert. The URL itself is never stored — only its host and a
#   SHA-256, so the channel is auditable without publishing a secret.
#
# THIS WORKFLOW CANNOT REPORT ITS OWN DEATH.
#   .github/workflows/health.yml is the independent watchdog. It judges the
#   artefacts this job leaves behind and fails when they are stale, drifted,
#   malformed or contradictory.

on:
  schedule:
    # Daily at 12:00 UTC during the NFL season (Sep-Feb), plus an extra
    # Wednesday 04:00 UTC poll. These are prototype polling times, not feed SLAs.
    - cron: '0 12 * 9,10,11,12,1,2 *'
    - cron: '0 4 * 9,10,11,12,1,2 3'
  workflow_dispatch:
    inputs:
      min_severity:
        description: 'Minimum severity to report (0-3)'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full unit test suite (must pass before we trust any alert)
        run: python3 -m unittest discover -s tests -v

      - name: Verify stored corrections still match the archived-page artefacts
        run: python3 pipeline/ingest_rendered.py --check

      # The archived-corrections parser is a separate manual/backfill tool; it
      # is not used by this scoreboard-only monitor. Do not let an unavailable
      # Wayback snapshot masquerade as either a clean monitoring run or a reason
      # to suppress the independent score snapshot.
      - name: Fetch current snapshot of the versioned game-results mirror
        id: snapshot
        run: python3 pipeline/run.py snapshot

      - name: Diff against the previous snapshot
        id: diff
        run: |
          PREV=$(ls -1dt snapshots/nfldata_games/*/ 2>/dev/null | sed -n 2p)
          if [ -z "$PREV" ]; then
            echo "No previous snapshot yet — this run establishes the baseline."
            echo "alerts=0" >> "$GITHUB_OUTPUT"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUR=$(ls -1dt snapshots/nfldata_games/*/ | sed -n 1p)
          echo "prev=$PREV cur=$CUR"
          # The detector returns 10 for alerts and 0 for a clean diff. Every
          # other code is an error: fail closed rather than report "no alerts."
          set +e
          python3 pipeline/run.py diff "${PREV}games.slim.csv" "${CUR}games.slim.csv" \
            --min-severity "${{ github.event.inputs.min_severity || 2 }}" \
            --out alerts/latest.md \
            --feed data/alerts/feed.json
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 10 ]; then
            echo "::error::Diff failed with exit code $CODE; alert status is unknown."
            exit "$CODE"
          fi
          echo "alerts=$CODE" >> "$GITHUB_OUTPUT"

      - name: Publish monitoring status to job summary
        if: always()
        run: |
          if [ "${{ steps.snapshot.outcome }}" != "success" ]; then
            echo "## Monitoring status: UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
            echo "Snapshot collection failed; this run cannot report whether discrepancies exist." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.diff.outcome }}" != "success" ]; then
            echo "## Monitoring status: UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
            echo "Snapshot was collected, but comparison failed. No clean result is being claimed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.diff.outputs.baseline }}" = "true" ]; then
            echo "## Monitoring status: BASELINE" >> "$GITHUB_STEP_SUMMARY"
            echo "A baseline was collected; no comparison was possible on this first run." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f alerts/latest.md ]; then
            cat alerts/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Monitoring status: UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
            echo "No alert report exists even though comparison did not fail; investigate the run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify configured webhook (with receipts, idempotency and retries)
        # `run.py deliver` records every attempt in data/alerts/deliveries.json:
        # an idempotency key derived from the compared snapshot hashes and alert
        # ids (so a re-run does not notify twice for one change), bounded
        # retries with backoff, and the HTTP outcome. A webhook that exhausts its
        # retries becomes a dead letter and exits 11, which fails this job so the
        # baseline is NOT advanced and the next run retries the same alert.
        # The URL itself is never written to the log.
        # Never deliver on a baseline run: alerts/latest.json is a committed
        # artefact, so without this guard a first run would re-send a previous
        # run's report. (Idempotency would usually catch it, but a newly
        # configured webhook would not have a prior receipt to match.)
        if: always() && steps.diff.outcome == 'success' && steps.diff.outputs.baseline != 'true'
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            export ALERT_WEBHOOK_URL="$WEBHOOK"
          fi
          set +e
          python3 pipeline/run.py deliver \
            --report alerts/latest.json \
            --deliveries data/alerts/deliveries.json
          CODE=$?
          set -e
          if [ "$CODE" -eq 11 ]; then
            echo "::error::Notification dead-lettered. Detection may have succeeded while nobody was told."
            exit 11
          fi
          exit "$CODE"

      - name: Upload evidence artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-${{ github.run_id }}
          path: |
            snapshots/nfldata_games/**/*.manifest.json
            alerts/
            data/alerts/
          retention-days: 90
          if-no-files-found: ignore

      # A successful comparison updates the feed. Re-copy it into the published
      # docs layout even on failures so the site stays internally synchronized;
      # the last successful feed timestamp still reveals staleness.
      # Regenerate the subscribable Atom feeds from the feed that was just
      # written, then re-sync. Order matters: an Atom file generated before the
      # new comparison is appended would publish a stale "latest" entry, and the
      # health watchdog would (correctly) fail the run for it.
      - name: Regenerate subscribable Atom feeds
        if: always()
        run: python3 pipeline/run.py atom

      - name: Sync published data copies
        if: always()
        run: ./pipeline/sync_site_data.sh

      - name: Assess and publish monitor health
        # Runs after the sync so it judges the state the site will actually
        # serve. Deliberately NON-FATAL here: failing this job would stop the
        # persist step and discard a good snapshot, which makes the next run
        # repeat the same comparison. The dedicated watchdog (health.yml) is the
        # job that fails loudly; this one publishes the evidence it reads.
        if: always()
        run: |
          set +e
          python3 pipeline/run.py health --fail-on none
          CODE=$?
          set -e
          ./pipeline/sync_site_data.sh > /dev/null
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::monitor health reported a problem; see data/alerts/health.json and the health workflow"
          fi
          exit 0

      # The snapshot store is the system's memory: without it there is nothing
      # to diff against on the next run.
      - name: Persist snapshots and feed
        # Do not advance the baseline after a failed comparison or failed
        # webhook delivery: the next run must be able to retry the same alert.
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f snapshots/ alerts/ data/alerts/ data/corrections.atom docs/data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: detection snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
